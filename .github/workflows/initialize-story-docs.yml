name: Initialize Story Documentation

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: Jira story key, for example PROJ-123
        required: true
        type: string

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    outputs:
      story_id: ${{ steps.initialize.outputs.story_id }}
      requirements_context: ${{ steps.initialize.outputs.requirements_context }}
    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@v4

      - name: Create story documentation
        id: initialize
        env:
          STORY_ID: ${{ inputs.story_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$STORY_ID" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]]; then
            echo "story_id must be a Jira key such as PROJ-123."
            exit 1
          fi

          story_dir="docs/$STORY_ID"
          if [[ -e "$story_dir" ]]; then
            echo "Refusing to overwrite existing path: $story_dir"
            exit 1
          fi

          mkdir -p "$story_dir"

          cat > "$story_dir/../pipeline-state.json.tmp" <<EOF
          {
            "storyId": "$STORY_ID",
            "currentStage": "01",
            "status": "in_progress",
            "artifact": "docs/$STORY_ID/01-requirements.md",
            "history": []
          }
          EOF
          python -m json.tool "$story_dir/../pipeline-state.json.tmp" > /dev/null
          mv "$story_dir/../pipeline-state.json.tmp" docs/pipeline-state.json

          cat > "$story_dir/pipeline-state.md" <<EOF
          # Pipeline State: $STORY_ID

          - Story ID: $STORY_ID
          - Current Stage: 01
          - Status: in_progress
          - Artifact Paths:
            - docs/$STORY_ID/01-requirements.md
            - docs/$STORY_ID/02-architecture.md
            - docs/$STORY_ID/03-design-review.md
            - docs/$STORY_ID/04-impl-plan.md
            - docs/$STORY_ID/05-implementation-summary.md
            - docs/$STORY_ID/06-code-review.md
            - docs/$STORY_ID/07-verification-report.md
            - docs/$STORY_ID/08-pr-summary.md
          - Approval Information:
            - Decision: pending
            - Approver: not assigned
            - Rationale: Story documentation initialized; requirements analysis is next.
            - Evidence: docs/$STORY_ID/requirements-context.md
            - Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Next action: 01-requirements.agent.md must retrieve and analyze the Jira story.
          EOF

          cat > "$story_dir/requirements-context.md" <<EOF
          # Requirements Agent Context: $STORY_ID

          - Story ID: $STORY_ID
          - Source: Jira story identified by the workflow input.
          - Consumer: 01-requirements.agent.md
          - Jira retrieval: Use Atlassian MCP as the authoritative source.
          - Required fields: title, description, status, priority, labels, dependencies, and acceptance criteria.
          - Output: docs/$STORY_ID/01-requirements.md
          - Handoff status: ready for requirements analysis
          EOF

          echo "story_id=$STORY_ID" >> "$GITHUB_OUTPUT"
          echo "requirements_context=$story_dir/requirements-context.md" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$story_dir"
          git commit -m "docs: initialize $STORY_ID story documentation"
          git push